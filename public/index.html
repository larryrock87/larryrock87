<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1730">
  <title>Votación · Festival de la Voz</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); }
    .wrap { width: min(1100px, 100%); margin: 0 auto; padding: 0 16px 60px; }

    header.hero { text-align: center; padding: 28px 8px 8px; }
    .logo-wrap { width: 132px; height: 132px; margin: 0 auto 14px; position: relative; }
    .logo-wrap img { width: 100%; height: 100%; border-radius: 50%; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 10px 30px rgba(214,178,94,.35)); }
    .logo-wrap::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(214,178,94,.35); animation: pulse 3s ease-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px); } }
    @keyframes pulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
    .hero h1 { margin: 0; font-size: clamp(1.3rem, 5.4vw, 2.4rem); line-height: 1.15; font-weight: 900; }
    .hero .year { font-family: var(--font-display); font-weight: 700; letter-spacing: .5em; color: var(--gold-300); margin: 6px 0 14px; font-size: .95rem; padding-left: .5em; }
    .hero .tricolor-line { width: 140px; margin: 0 auto; }

    /* Estado */
    .status { margin: 22px auto 18px; max-width: 640px; text-align: center; padding: 18px 20px; }
    .status h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.15rem; color: var(--gold-200); letter-spacing: .06em; }
    .status p { margin: 0; color: var(--silver-300); font-size: .92rem; line-height: 1.5; }
    .notes { display: inline-flex; gap: 6px; margin-bottom: 6px; font-size: 1.3rem; color: var(--gold-300); }
    .notes span { animation: note 1.6s ease-in-out infinite; display: inline-block; }
    .notes span:nth-child(2) { animation-delay: .2s; } .notes span:nth-child(3) { animation-delay: .4s; }
    @keyframes note { 50% { transform: translateY(-6px); opacity: .6; } }

    /* Barra de tiempo (solo con votación abierta) */
    .timer { position: sticky; top: 0; z-index: 20; margin: 0 -16px 16px; padding: 10px 16px; background: rgba(5,12,27,.82); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(214,178,94,.3); display: none; }
    .timer.show { display: block; animation: drop .5s ease; }
    @keyframes drop { from { transform: translateY(-100%); } }
    .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .live-dot { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: .78rem; letter-spacing: .18em; color: #fff; }
    .live-dot i { width: 10px; height: 10px; border-radius: 50%; background: var(--ve-red); box-shadow: 0 0 0 0 rgba(207,20,43,.7); animation: live 1.4s infinite; }
    @keyframes live { 70% { box-shadow: 0 0 0 10px rgba(207,20,43,0); } 100% { box-shadow: 0 0 0 0 rgba(207,20,43,0); } }
    .clock { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .clock.urgent { color: #ff8a95; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .55; } }
    .timebar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); margin: 8px auto 0; max-width: 1100px; overflow: hidden; }
    .timebar > div { height: 100%; background: var(--gold-grad); transition: width 1s linear; }

    .search { display: flex; justify-content: center; margin: 4px 0 18px; }
    .search input { width: min(420px, 100%); background: rgba(10,23,48,.7); border: 1px solid rgba(214,178,94,.35); color: #fff; padding: 12px 18px; border-radius: 999px; font: inherit; outline: none; }
    .search input:focus { border-color: var(--gold-300); box-shadow: 0 0 0 3px rgba(214,178,94,.15); }

    /* Tarjetas */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 200px), 1fr)); gap: 14px; }
    @media (min-width: 640px) { .grid { gap: 20px; } }
    .card { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--navy-800); box-shadow: var(--shadow-gold); transform: translateY(14px); opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; transition: transform .3s, opacity .4s, filter .4s, box-shadow .3s; }
    @keyframes rise { to { transform: none; opacity: 1; } }
    .card .ph { aspect-ratio: 3/4; position: relative; overflow: hidden; }
    .card .ph img, .card .ph .avatar-fallback { width: 100%; height: 100%; object-fit: cover; font-size: 3rem; transition: transform .6s; }
    .card:hover .ph img { transform: scale(1.04); }
    .card .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(5,12,27,.95)); }
    .num { position: absolute; top: 10px; left: 10px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; color: #2a1d02; background: var(--gold-grad); box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7); font-size: .95rem; }
    .info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 12px 12px; }
    .grado { font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-300); font-weight: 700; margin-bottom: 3px; }
    .name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; line-height: 1.15; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    .card .vote { display: none; width: 100%; margin-top: 10px; padding: .75em 1em; }
    body.open:not(.voted) .card .vote { display: block; animation: rise .4s ease forwards; }
    body.voted .card:not(.mine) { filter: grayscale(.7) brightness(.6); }
    .card.mine { box-shadow: 0 0 0 3px var(--gold-300), 0 0 40px rgba(214,178,94,.6); transform: scale(1.02); }
    .card .badge { display: none; position: absolute; top: 10px; right: 10px; z-index: 3; background: var(--gold-grad); color: #2a1d02; font-weight: 800; font-size: .66rem; letter-spacing: .1em; padding: 6px 10px; border-radius: 999px; text-transform: uppercase; }
    .card.mine .badge { display: block; }

    .empty { text-align: center; padding: 40px; color: var(--silver-300); }

    /* Modal */
    .modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 16px; background: rgba(3,8,18,.78); backdrop-filter: blur(6px); }
    .modal.show { display: grid; animation: fade .25s; }
    @keyframes fade { from { opacity: 0; } }
    .modal .box { width: min(380px, 100%); text-align: center; padding: 24px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } }
    .modal .pic { width: 150px; height: 150px; margin: 0 auto 14px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px var(--gold-400), 0 0 40px rgba(214,178,94,.5); }
    .modal .pic img, .modal .pic .avatar-fallback { width: 100%; height: 100%; object-fit: cover; font-size: 2.6rem; }
    .modal h3 { font-family: var(--font-display); margin: 0 0 6px; font-size: 1.3rem; }
    .modal p { color: var(--silver-300); margin: 0 0 18px; font-size: .9rem; }
    .modal .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    /* Gracias */
    .thanks { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, rgba(31,63,110,.95), rgba(5,12,27,.98)); }
    .thanks.show { display: grid; animation: fade .4s; }
    .thanks .check { width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-grad); box-shadow: 0 0 60px rgba(214,178,94,.6); animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
    .thanks .check svg { width: 56px; height: 56px; stroke: #2a1d02; stroke-width: 4; fill: none; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .6s .35s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .thanks h2 { font-family: var(--font-display); font-size: 1.8rem; margin: 0 0 8px; }
    .thanks p { color: var(--silver-300); margin: 0 0 22px; }

    footer { text-align: center; color: var(--silver-500); font-size: .75rem; padding: 30px 0 10px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div class="stage-bg"></div>

  <div class="wrap">
    <div class="timer" id="timer">
      <div class="timer-row">
        <span class="live-dot"><i></i> VOTACIÓN ABIERTA</span>
        <span class="clock" id="clock">--:--</span>
      </div>
      <div class="timebar"><div id="timebar" style="width:100%"></div></div>
    </div>

    <header class="hero">
      <div class="logo-wrap"><img src="/img/logo-256.webp" alt="Logo del Festival"></div>
      <h1 class="display gold-text" id="title">Festival de la Voz Ministerial del MPPD</h1>
      <div class="year" id="year">2026</div>
      <div class="tricolor-line"></div>
    </header>

    <section class="status panel" id="status" aria-live="polite"></section>

    <div class="search" id="searchWrap" hidden>
      <input id="search" type="search" placeholder="Buscar participante…" aria-label="Buscar participante">
    </div>

    <main class="grid" id="grid"></main>
    <footer>FESTIVAL DE LA VOZ MINISTERIAL DEL MPPD · <span id="fyear">2026</span></footer>
  </div>

  <div class="modal" id="confirm" role="dialog" aria-modal="true" aria-labelledby="cName">
    <div class="box panel">
      <div class="pic" id="cPic"></div>
      <div class="grado" id="cGrado"></div>
      <h3 id="cName"></h3>
      <p>Confirma tu voto. <strong>Solo puedes votar una vez</strong> y no podrás cambiarlo.</p>
      <div class="actions">
        <button class="btn ghost" id="cCancel">Cancelar</button>
        <button class="btn" id="cOk">Confirmar voto</button>
      </div>
    </div>
  </div>

  <div class="thanks" id="thanks">
    <div>
      <div class="check"><svg viewBox="0 0 52 52"><path d="M14 27 l8 8 l16 -18"/></svg></div>
      <h2 class="gold-text">¡Gracias por votar!</h2>
      <p id="thanksMsg">Tu voto ha sido registrado.</p>
      <button class="btn" id="thanksOk">Continuar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (() => {
    const $ = (s) => document.querySelector(s);
    let state = null, me = { voted: false, participantId: null }, filter = '', pending = null, sending = false;

    // identificador local persistente (respaldo de la cookie)
    let localId = null;
    try {
      localId = localStorage.getItem('fv_local');
      if (!/^[a-f0-9]{32}$/.test(localId || '')) {
        localId = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('fv_local', localId);
      }
    } catch { localId = null; }

    function fingerprint() {
      try {
        const c = document.createElement('canvas'); const x = c.getContext('2d');
        x.textBaseline = 'top'; x.font = '16px Arial'; x.fillStyle = '#f60'; x.fillRect(0, 0, 60, 20);
        x.fillStyle = '#069'; x.fillText('MPPD-2026 🎤', 2, 2);
        const parts = [navigator.userAgent, navigator.language, screen.width + 'x' + screen.height, screen.colorDepth, devicePixelRatio,
          Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency, navigator.maxTouchPoints, c.toDataURL().slice(-80)].join('|');
        let h = 2166136261; for (let i = 0; i < parts.length; i++) { h ^= parts.charCodeAt(i); h = Math.imul(h, 16777619); }
        let h2 = 5381; for (let i = 0; i < parts.length; i++) h2 = (Math.imul(h2, 33) ^ parts.charCodeAt(i)) >>> 0;
        return (h >>> 0).toString(16) + h2.toString(16) + parts.length.toString(16);
      } catch { return ''; }
    }

    function localVoteKey() { return state ? 'fv_voted_' + state.voting.round : ''; }

    async function loadMe() {
      try {
        const r = await fetch('/api/me', { credentials: 'same-origin' }).then((r) => r.json());
        me = { voted: r.voted, participantId: r.participantId };
        if (!me.voted && state) {
          try { const v = localStorage.getItem('fv_voted_' + r.round); if (v) me = { voted: true, participantId: v }; } catch {}
        }
      } catch {}
      render();
    }

    function renderStatus() {
      const st = state.voting.status, el = $('#status');
      el.hidden = false;
      if (me.voted && st !== 'idle') {
        const p = state.participants.find((x) => x.id === me.participantId);
        el.innerHTML = `<div class="notes"><span>♪</span><span>♫</span><span>♪</span></div><h2>Tu voto fue registrado</h2><p>${p ? 'Votaste por <strong>' + FV.esc(FV.fullName(p)) + '</strong>. ' : ''}¡Gracias por participar! Disfruta la gala.</p>`;
      } else if (st === 'open') {
        el.innerHTML = `<h2>¡Vota por tu cantante favorito!</h2><p>Toca <strong>VOTAR</strong> debajo de tu participante preferido. Solo puedes votar <strong>una vez</strong>.</p>`;
      } else if (st === 'closed') {
        el.innerHTML = `<div class="notes"><span>♪</span><span>♫</span><span>♪</span></div><h2>La votación ha finalizado</h2><p>Gracias por acompañarnos. Los resultados se anunciarán en la gala.</p>`;
      } else {
        el.innerHTML = `<div class="notes"><span>♪</span><span>♫</span><span>♪</span></div><h2>Conoce a nuestros participantes</h2><p>Mantén esta página abierta. Cuando se abra la votación podrás elegir a tu favorito.</p>`;
      }
    }

    function render() {
      if (!state) return;
      const open = state.voting.status === 'open';
      document.body.classList.toggle('open', open);
      document.body.classList.toggle('voted', !!me.voted);
      $('#timer').classList.toggle('show', open);
      $('#title').textContent = state.title; $('#year').textContent = state.year; $('#fyear').textContent = state.year;
      renderStatus();

      const list = state.participants.filter((p) => !filter || (FV.fullName(p) + ' ' + p.grado).toLowerCase().includes(filter));
      $('#searchWrap').hidden = state.participants.length < 9;
      const grid = $('#grid');
      if (!state.participants.length) { grid.innerHTML = `<div class="empty">Pronto conocerás a los participantes.</div>`; return; }
      const key = list.map((p) => p.id + p.photo + p.nombre + p.apellidos + p.grado + p.number).join();
      if (grid.dataset.key !== key) {
        grid.dataset.key = key;
        grid.innerHTML = list.map((p, i) => `
          <article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i, 12) * 50}ms">
            <div class="ph">${FV.photoHtml(p)}</div>
            <span class="num">${p.number}</span>
            <span class="badge">★ Tu voto</span>
            <div class="info">
              ${p.grado ? `<div class="grado">${FV.esc(p.grado)}</div>` : ''}
              <div class="name">${FV.esc(p.nombre)}<br>${FV.esc(p.apellidos)}</div>
              <button class="btn vote" data-vote="${p.id}">Votar</button>
            </div>
          </article>`).join('');
      }
      grid.querySelectorAll('.card').forEach((c) => c.classList.toggle('mine', me.voted && c.dataset.id === me.participantId));
    }

    function tick() {
      if (state && state.voting.status === 'open' && state.voting.endsAt) {
        const left = state.voting.endsAt - FV.now();
        const clock = $('#clock');
        clock.textContent = FV.fmtTime(left);
        clock.classList.toggle('urgent', left < 60000);
        const total = state.voting.endsAt - (state.voting.startsAt || FV.now());
        $('#timebar').style.width = Math.max(0, Math.min(100, (left / total) * 100)) + '%';
      }
    }
    setInterval(tick, 250);

    function openConfirm(id) {
      const p = state.participants.find((x) => x.id === id); if (!p) return;
      pending = id;
      $('#cPic').innerHTML = FV.photoHtml(p);
      $('#cGrado').textContent = p.grado || '';
      $('#cName').textContent = FV.fullName(p);
      $('#confirm').classList.add('show');
      $('#cOk').focus();
    }
    const closeConfirm = () => { $('#confirm').classList.remove('show'); pending = null; };

    async function sendVote() {
      if (!pending || sending) return;
      sending = true; $('#cOk').disabled = true; $('#cOk').textContent = 'Enviando…';
      try {
        const r = await fetch('/api/vote', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ participantId: pending, fp: fingerprint(), localId }) });
        const j = await r.json();
        if (r.ok) {
          me = { voted: true, participantId: j.participantId };
          try { localStorage.setItem(localVoteKey(), j.participantId); } catch {}
          const p = state.participants.find((x) => x.id === j.participantId);
          $('#thanksMsg').innerHTML = `Votaste por <strong>${FV.esc(FV.fullName(p))}</strong>.<br>¡Tu voz cuenta!`;
          closeConfirm();
          $('#thanks').classList.add('show');
          FV.confetti({ duration: 2500, count: 160 });
          if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
        } else {
          if (j.participantId) { me = { voted: true, participantId: j.participantId }; try { localStorage.setItem(localVoteKey(), j.participantId); } catch {} }
          else if (r.status === 409 && /dispositivo|registraste/.test(j.error || '')) { me = { voted: true, participantId: null }; try { localStorage.setItem(localVoteKey(), '1'); } catch {} }
          closeConfirm();
          FV.toast(j.error || 'No se pudo registrar el voto.', 'error');
        }
      } catch {
        FV.toast('Sin conexión. Intenta de nuevo.', 'error');
      } finally {
        sending = false; $('#cOk').disabled = false; $('#cOk').textContent = 'Confirmar voto';
        render();
      }
    }

    $('#grid').addEventListener('click', (e) => { const b = e.target.closest('[data-vote]'); if (b && !me.voted) openConfirm(b.dataset.vote); });
    $('#cCancel').onclick = closeConfirm;
    $('#confirm').addEventListener('click', (e) => { if (e.target.id === 'confirm') closeConfirm(); });
    $('#cOk').onclick = sendVote;
    $('#thanksOk').onclick = () => $('#thanks').classList.remove('show');
    $('#search').addEventListener('input', (e) => { filter = e.target.value.trim().toLowerCase(); render(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeConfirm(); });

    const socket = io({ auth: { role: 'public' } });
    socket.on('state', (s) => {
      const prevRound = state && state.voting.round;
      const wasOpen = state && state.voting.status === 'open';
      FV.syncClock(s.now);
      state = s;
      if (prevRound && prevRound !== s.voting.round) { me = { voted: false, participantId: null }; }
      if (!wasOpen && s.voting.status === 'open' && prevRound) FV.toast('¡La votación está abierta!', 'ok');
      loadMe();
      tick();
    });
    socket.on('connect', () => document.body.classList.remove('offline'));
  })();
  </script>
</body>
</html>
